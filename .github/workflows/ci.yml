name: ci

on:
  push:
    branches: [main, ef11]
  pull_request:
    branches: [main, ef11]

permissions:
  contents: read

env:
  TZ: UTC
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.100
      - name: Build
        run: dotnet build MongoDB.EFCoreProvider.sln -c Release --nologo
      - name: Unit tests
        run: dotnet test tests/MongoDB.EntityFrameworkCore.UnitTests/MongoDB.EntityFrameworkCore.UnitTests.csproj -c Release --no-build --nologo
      - name: Functional tests (Atlas Search excluded)
        run: >
          dotnet test tests/MongoDB.EntityFrameworkCore.FunctionalTests/MongoDB.EntityFrameworkCore.FunctionalTests.csproj
          -c Release --no-build --nologo
          --filter "FullyQualifiedName!~SearchIndexTests&FullyQualifiedName!~SearchIndexExamplesTests"
      - name: Specification smoke tests
        run: |
          exe="tests/MongoDB.EntityFrameworkCore.SpecificationTests/bin/Release/net11.0/MongoDB.EntityFrameworkCore.SpecificationTests"
          chmod +x "$exe"
          "$exe" -class "*NorthwindWhereQueryMongoTest" -culture invariant -noColor
          "$exe" -class "*NorthwindGroupByQueryMongoTest" -culture invariant -noColor
      - name: Pack
        run: dotnet pack src/MongoDB.EntityFrameworkCore/MongoDB.EntityFrameworkCore.csproj -c Release -o artifacts --no-build --nologo
      - name: Verify package
        shell: pwsh
        run: ./eng/verify-package.ps1 -PackagePath (Get-ChildItem artifacts/*.nupkg | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
